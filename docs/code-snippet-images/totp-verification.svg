<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="548" viewBox="0 0 1200 548">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101c2b"/><stop offset="1" stop-color="#182c39"/></linearGradient></defs>
<rect width="1200" height="548" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="546" rx="23" fill="none" stroke="#35515e"/>
<circle cx="42" cy="42" r="7" fill="#f77669"/><circle cx="66" cy="42" r="7" fill="#f6c85f"/><circle cx="90" cy="42" r="7" fill="#62c554"/>
<text x="118" y="49" class="title">Time-based one-time password</text><text x="48" y="91" class="sub">SECURITY ? replay-resistant TOTP verification</text>
<line x1="40" y1="112" x2="1160" y2="112" stroke="#2e4654"/>
<text x="46" y="158" class="num">01</text><text x="94" y="158" fill="#c792ea" class="code">public static function verify(</text><text x="46" y="185" class="num">02</text><text x="94" y="185" fill="#d6deeb" class="code">    string $secret, string $code, int $time, int $lastStep = 0</text><text x="46" y="212" class="num">03</text><text x="94" y="212" fill="#d6deeb" class="code">): ?int {</text><text x="46" y="239" class="num">04</text><text x="94" y="239" fill="#d6deeb" class="code">    if (!preg_match(&quot;/^\d{6}$/&quot;, $code) || $time &lt; 0) return null;</text><text x="46" y="266" class="num">05</text><text x="94" y="266" fill="#d6deeb" class="code">    $currentStep = intdiv($time, self::PERIOD);</text><text x="46" y="293" class="num">06</text><text x="94" y="293" fill="#d6deeb" class="code">    for ($step = max(0, $currentStep - 1);</text><text x="46" y="320" class="num">07</text><text x="94" y="320" fill="#d6deeb" class="code">         $step &lt;= $currentStep + 1; $step++) {</text><text x="46" y="347" class="num">08</text><text x="94" y="347" fill="#d6deeb" class="code">        if ($step &lt;= $lastStep) continue;</text><text x="46" y="374" class="num">09</text><text x="94" y="374" fill="#d6deeb" class="code">        $expected = self::code($secret, $step * self::PERIOD);</text><text x="46" y="401" class="num">10</text><text x="94" y="401" fill="#d6deeb" class="code">        if (hash_equals($expected, $code)) return $step;</text><text x="46" y="428" class="num">11</text><text x="94" y="428" fill="#d6deeb" class="code">    }</text><text x="46" y="455" class="num">12</text><text x="94" y="455" fill="#d6deeb" class="code">    return null;</text><text x="46" y="482" class="num">13</text><text x="94" y="482" fill="#d6deeb" class="code">}</text><text x="46" y="509" class="num">14</text><text x="94" y="509" fill="#637a91" class="code">// Accepts a small clock drift window; rejects replayed codes.</text>
<style>.title{font:600 25px 'Segoe UI',Arial,sans-serif;fill:#eff8f5}.sub{font:14px 'Segoe UI',Arial,sans-serif;fill:#83b5a6;letter-spacing:1px}.code{font:16px Consolas,'Courier New',monospace;white-space:pre}.num{font:13px Consolas,monospace;fill:#526b7b}</style></svg>