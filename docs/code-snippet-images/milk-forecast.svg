<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="602" viewBox="0 0 1200 602">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101c2b"/><stop offset="1" stop-color="#182c39"/></linearGradient></defs>
<rect width="1200" height="602" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="600" rx="23" fill="none" stroke="#35515e"/>
<circle cx="42" cy="42" r="7" fill="#f77669"/><circle cx="66" cy="42" r="7" fill="#f6c85f"/><circle cx="90" cy="42" r="7" fill="#62c554"/>
<text x="118" y="49" class="title">Milk production forecast</text><text x="48" y="91" class="sub">ML ? ridge regression + weather signals</text>
<line x1="40" y1="112" x2="1160" y2="112" stroke="#2e4654"/>
<text x="46" y="158" class="num">01</text><text x="94" y="158" fill="#c792ea" class="code">def forecast(observations, horizon=7):</text><text x="46" y="185" class="num">02</text><text x="94" y="185" fill="#d6deeb" class="code">    validate_observations(observations)</text><text x="46" y="212" class="num">03</text><text x="94" y="212" fill="#d6deeb" class="code">    if horizon &lt; 1 or horizon &gt; 30:</text><text x="46" y="239" class="num">04</text><text x="94" y="239" fill="#ecc48d" class="code">        raise ValueError(&quot;horizon must be between 1 and 30 days&quot;)</text><text x="46" y="266" class="num">05</text><text x="94" y="266" fill="#d6deeb" class="code">    history = [dict(item) for item in observations]</text><text x="46" y="293" class="num">06</text><text x="94" y="293" fill="#d6deeb" class="code">    values = [float(item[&quot;litres&quot;]) for item in history]</text><text x="46" y="320" class="num">07</text><text x="94" y="320" fill="#d6deeb" class="code">    x_train = [build_features(history, i, True, *weather_means(history, len(history)))</text><text x="46" y="347" class="num">08</text><text x="94" y="347" fill="#d6deeb" class="code">                for i in range(7, len(history))]</text><text x="46" y="374" class="num">09</text><text x="94" y="374" fill="#d6deeb" class="code">    model = Ridge(alpha=1.0).fit(x_train, values[7:])</text><text x="46" y="401" class="num">10</text><text x="94" y="401" fill="#d6deeb" class="code">    forecast_values = []</text><text x="46" y="428" class="num">11</text><text x="94" y="428" fill="#d6deeb" class="code">    for step in range(1, horizon + 1):</text><text x="46" y="455" class="num">12</text><text x="94" y="455" fill="#d6deeb" class="code">        future_date = last_date + timedelta(days=step)</text><text x="46" y="482" class="num">13</text><text x="94" y="482" fill="#d6deeb" class="code">        prediction = max(0.0, model.predict(features)[0])</text><text x="46" y="509" class="num">14</text><text x="94" y="509" fill="#d6deeb" class="code">        history.append({&quot;date&quot;: future_date, &quot;litres&quot;: prediction})</text><text x="46" y="536" class="num">15</text><text x="94" y="536" fill="#d6deeb" class="code">        forecast_values.append({&quot;date&quot;: future_date, &quot;litres&quot;: round(prediction, 2)})</text><text x="46" y="563" class="num">16</text><text x="94" y="563" fill="#c792ea" class="code">    return {&quot;forecast&quot;: forecast_values, &quot;backtest&quot;: evaluation}</text>
<style>.title{font:600 25px 'Segoe UI',Arial,sans-serif;fill:#eff8f5}.sub{font:14px 'Segoe UI',Arial,sans-serif;fill:#83b5a6;letter-spacing:1px}.code{font:16px Consolas,'Courier New',monospace;white-space:pre}.num{font:13px Consolas,monospace;fill:#526b7b}</style></svg>